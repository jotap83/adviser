<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2196" viewBox="0 0 1100 2196"><style>text{font-family:Arial,sans-serif;fill:#263d5e}.title{font-size:30px;font-weight:bold}.h{font-size:18px;font-weight:bold}.p{font-size:14px}.small{font-size:12px;fill:#607896}.owner{font-size:11px;fill:#245edb}.white{fill:white}.arrow{stroke:#9daec5;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#9daec5"/></marker></defs><rect width="1100" height="2196" fill="#f6f8fc"/><text x="70" y="66" class="title">Adviser · Do primeiro contato ao fechamento</text><text x="70" y="97" class="p">Sequência principal de cima para baixo. Retornos estão descritos junto à etapa.</text><rect x="420" y="127" width="260" height="44" rx="8" fill="#245edb"/><text x="550" y="155" class="h white" text-anchor="middle">INÍCIO</text><path d="M550 171V193" class="arrow"/><rect x="115" y="201" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="238" r="17" fill="#eaf0fc"/><text x="151" y="244" class="h" text-anchor="middle">1</text><text x="188" y="226" class="owner">Cliente → Atendimento</text><text x="188" y="253" class="h">Cliente entra em contato</text><text x="188" y="280" class="p">E-mail ou ligação para a Adviser.</text><path d="M550 311V333" class="arrow"/><rect x="115" y="341" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="378" r="17" fill="#eaf0fc"/><text x="151" y="384" class="h" text-anchor="middle">2</text><text x="188" y="366" class="owner">Atendimento</text><text x="188" y="393" class="h">Atendimento registra a demanda</text><text x="188" y="420" class="p">Mensagem ou anotações, cliente e responsável.</text><path d="M550 451V473" class="arrow"/><rect x="115" y="481" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="518" r="17" fill="#eaf0fc"/><text x="151" y="524" class="h" text-anchor="middle">3</text><text x="188" y="506" class="owner">Atendimento + IA</text><text x="188" y="533" class="h">IA sugere briefing e perguntas</text><text x="188" y="560" class="p">A equipe revisa. Preenchimento manual sempre disponível.</text><path d="M550 591V613" class="arrow"/><rect x="115" y="621" width="870" height="160" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="658" r="17" fill="#eaf0fc"/><text x="151" y="664" class="h" text-anchor="middle">4</text><text x="188" y="646" class="owner">Atendimento ↔ Cliente</text><text x="188" y="673" class="h">Alinhar e validar o briefing</text><text x="188" y="700" class="p">A Adviser formaliza por e-mail; o cliente confirma pelo canal habitual.</text><rect x="185" y="719" width="770" height="42" rx="6" fill="#f0f4fa"/><text x="200" y="744" class="small">Se faltar informação: repetir o alinhamento. Avançar após a validação.</text><path d="M550 781V803" class="arrow"/><rect x="115" y="811" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="848" r="17" fill="#eaf0fc"/><text x="151" y="854" class="h" text-anchor="middle">5</text><text x="188" y="836" class="owner">Atendimento → Fornecedores</text><text x="188" y="863" class="h">Solicitar cotações</text><text x="188" y="890" class="p">Selecionar fornecedores; preparar e-mails e links individuais.</text><path d="M550 921V943" class="arrow"/><rect x="115" y="951" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="988" r="17" fill="#eaf0fc"/><text x="151" y="994" class="h" text-anchor="middle">6</text><text x="188" y="976" class="owner">Fornecedores → Atendimento</text><text x="188" y="1003" class="h">Receber respostas padronizadas</text><text x="188" y="1030" class="p">Modelo por categoria, vários itens, preços, condições e anexo.</text><path d="M550 1061V1083" class="arrow"/><rect x="115" y="1091" width="870" height="160" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="1128" r="17" fill="#eaf0fc"/><text x="151" y="1134" class="h" text-anchor="middle">7</text><text x="188" y="1116" class="owner">Atendimento</text><text x="188" y="1143" class="h">Comparar e elaborar a proposta</text><text x="188" y="1170" class="p">Selecionar cotações, revisar valores, salvar versão e gerar PDF / Excel.</text><rect x="185" y="1189" width="770" height="42" rx="6" fill="#fff5e3"/><text x="200" y="1214" class="small">CRIAÇÃO: conceito e referências podem apoiar desde o briefing; gestão completa na etapa 2.</text><path d="M550 1251V1273" class="arrow"/><rect x="115" y="1281" width="870" height="160" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="1318" r="17" fill="#eaf0fc"/><text x="151" y="1324" class="h" text-anchor="middle">8</text><text x="188" y="1306" class="owner">Atendimento ↔ Cliente</text><text x="188" y="1333" class="h">Cliente recebe e decide</text><text x="188" y="1360" class="p">Registrar a resposta e a evidência vinculada à versão enviada.</text><rect x="185" y="1379" width="770" height="42" rx="6" fill="#f0f4fa"/><text x="200" y="1404" class="small">Ajustes: voltar à etapa 7. Recusa: encerrar sem repasse. Aceite: seguir para a etapa 9.</text><path d="M550 1441V1463" class="arrow"/><rect x="115" y="1471" width="870" height="110" rx="12" fill="white" stroke="#dbe3ef"/><circle cx="151" cy="1508" r="17" fill="#eaf0fc"/><text x="151" y="1514" class="h" text-anchor="middle">9</text><text x="188" y="1496" class="owner">Atendimento → Financeiro</text><text x="188" y="1523" class="h">Preparar o repasse ao financeiro</text><text x="188" y="1550" class="p">Versão aprovada, aceite, fornecedores, condições e pagamentos diretos.</text><path d="M550 1581V1603" class="arrow"/><rect x="115" y="1611" width="870" height="50" rx="8" fill="#2c7255"/><text x="550" y="1643" class="h white" text-anchor="middle">FIM DO MVP · proposta aprovada e repasse organizado</text><text x="550" y="1706" class="h" text-anchor="middle">EVOLUÇÃO APÓS O MVP</text><rect x="115" y="1736" width="870" height="140" rx="12" fill="white" stroke="#9aafc8" stroke-dasharray="5 4"/><circle cx="151" cy="1773" r="17" fill="#eaf0fc"/><text x="151" y="1779" class="h" text-anchor="middle">10</text><text x="188" y="1761" class="owner">CRIAÇÃO E PRODUÇÃO · ETAPA 2</text><text x="188" y="1788" class="h">Proposta aceita vira projeto / evento</text><text x="188" y="1818" class="p">Herdar histórico e orçamento. Detalhar a criação, confirmar contratações,</text><text x="188" y="1841" class="p">organizar tarefas, produzir e executar o evento.</text><path d="M550 1876V1898" class="arrow"/><rect x="115" y="1906" width="870" height="140" rx="12" fill="white" stroke="#9aafc8" stroke-dasharray="5 4"/><circle cx="151" cy="1943" r="17" fill="#eaf0fc"/><text x="151" y="1949" class="h" text-anchor="middle">11</text><text x="188" y="1931" class="owner">FINANCEIRO · ETAPA 3</text><text x="188" y="1958" class="h">Controlar e fechar o financeiro</text><text x="188" y="1988" class="p">Recebimentos e pagamentos ao longo do projeto. Depois do evento: conciliação,</text><text x="188" y="2011" class="p">previsto × realizado e fechamento. Integração com Conta Azul a validar.</text><path d="M550 2046V2068" class="arrow"/><rect x="115" y="2076" width="870" height="50" rx="8" fill="#30475d"/><text x="550" y="2108" class="h white" text-anchor="middle">FIM DO PROCESSO COMPLETO · evento e financeiro encerrados</text><text x="550" y="2161" class="small" text-anchor="middle">Cotação não é contratação. O aceite não contrata fornecedores automaticamente.</text></svg>